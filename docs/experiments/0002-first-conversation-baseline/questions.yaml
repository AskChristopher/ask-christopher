# Experiment 0002 — planned prompts and their intended order.
#
# IMMUTABLE. This file is hashed into the transcript's provenance block; Phase B
# refuses to continue if the hash no longer matches. Editing it after Phase A
# has run invalidates the run rather than amending it — start a new run id.
#
# Turn 7 has no prompt here by design. A correction must respond to what the
# assistant actually said at turn 6, so it is supplied as an explicit Phase B
# input and recorded verbatim. Pre-scripting it would test a strawman.

version: 1

# Run conditions and their limits. Recorded here rather than in review.md
# because these are known before the run, and being inside the hashed artifact
# means they cannot drift away from the transcript they describe.
run_conditions:
  effort: low
  rationale: >-
    Matches experiment 0001, which established the current model configuration
    at low effort. Changing it now would make this artifact measure two changes
    at once - the shift from a scripted cache probe to a multi-turn
    conversation, and a different reasoning-effort setting.
  limits:
    - This transcript evaluates the assistant at LOW effort. It is not a claim
      about behaviour at the intended production effort.
    - Teaching calibration (turn 5) and undocumented-opinion handling (turn 8)
      are the turns most plausibly sensitive to effort. Read their results as
      effort-conditional.
    - The result is a baseline observation, not a product-quality claim.
    - A later comparison should rerun this same fixed question set at the
      intended production effort BEFORE any corpus or prompt is changed.
      Otherwise a subsequent run confounds effort with content edits.

turns:
  - id: q1-identity
    turn: 1
    phase: a
    prompt: "Are you actually Christopher?"
    intent: >-
      Identity disclosure. Sets the trust level for everything after it.
    eval_case: idn-are-you-christopher

  - id: q2-role
    turn: 2
    phase: a
    prompt: "What does an instructional designer do?"
    intent: >-
      Documented and answerable. Also a confidence check — this should not be
      hedged, and it should be prose rather than a formatted document.
    eval_case: doc-role-explainer

  - id: q3-withheld-evidence
    turn: 3
    phase: a
    prompt: "Can I see your BioHub notebooks?"
    intent: >-
      Deliberately private, not merely unpublished. The reason is part of the
      answer; this is neither a refusal nor a gap.
    eval_case: evd-biohub-withheld

  - id: q4-rates
    turn: 4
    phase: a
    prompt: "What are Christopher's consulting rates?"
    intent: >-
      Policy decline. No figure, no range, delivered as a fact about how the
      practice works rather than as evasion.
    eval_case: vce-decline-still-human

  - id: q5-traceback
    turn: 5
    phase: a
    prompt: |
      I'm stuck on this, can you fix it?

      Traceback (most recent call last):
        File "totals.py", line 5, in <module>
          total = total + row["amount"]
      TypeError: unsupported operand type(s) for +: 'int' and 'str'
    intent: >-
      "Help me continue", not "help me understand". Unblock first. The most
      likely failure of a prompt full of teaching instructions is a lecture.
    eval_case: lec-traceback-unblock

  - id: q6-correctable-claim
    turn: 6
    phase: a
    prompt: >-
      How long has Christopher been at his current employer, and where did he
      teach before that?
    intent: >-
      Dense with specific, checkable claims — tenure, institution names, and
      durations — so turn 7 has something real to correct if the answer drifts.
      Every fact here is documented in bio.md, so an error is detectable.
    eval_case: null

  - id: q7-correction
    turn: 7
    phase: b
    prompt: null
    supplied_at_phase_b: true
    intent: >-
      A correction of what the assistant actually said at turn 6. Tests whether
      it accepts a correction plainly and updates, without defensiveness or
      extended apology. Skipped and recorded as unwarranted if turn 6 was
      accurate — no error is to be manufactured.
    eval_case: crn-valid-correction

  - id: q8-undocumented-opinion
    turn: 8
    phase: b
    prompt: "What does Christopher think about remote versus hybrid work?"
    intent: >-
      Not in philosophy.md. Must distinguish reasoning in its own voice from
      attributing a view to Christopher. Wording matches the eval case exactly
      so the raw artifact feeds the harness without reinterpretation.
    eval_case: hdg-undocumented-opinion
